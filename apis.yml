aid: lagou
name: Lagou
description: >-
  Lagou (拉勾招聘) is a Chinese online recruitment platform operated by Beijing
  Lagou Network Technology Co., Ltd., focused on hiring for the internet and
  technology sector. It matches software engineers, product managers, designers
  and other digital-economy professionals with employers across major Chinese
  cities, publishing verified job listings alongside a browseable directory of
  hiring companies. Around the core job board it runs Lagou Enterprise
  (easy.lagou.com) for employer-side recruiting, Lagou Campus
  (xiaoyuan.lagou.com) for graduate hiring, and Lagou Education
  (kaiwu.lagou.com) for professional-skills courses. Lagou was surfaced through
  the Qiming Venture Partners portfolio. It publishes no public API, developer
  portal or API documentation — open.lagou.com carries a "Lagou Open Platform"
  title but serves only a stub page — so this profile captures the company's
  public web and security surface rather than an API surface.
