note: >-
  Lagou publishes NO API client SDKs — the company operates no public API, so
  there is nothing to write a client against. What it does publish openly are
  front-end engineering libraries from its web team (GitHub org Lagou-Frontend,
  created 2014). These are catalogued here for completeness and are deliberately
  NOT wired as `type: SDKs` in apis.yml: they are UI/build tooling, not API
  client libraries, and emitting an SDK pointer for them would misrepresent the
  provider. PyPI, Maven Central, NuGet, pkg.go.dev, RubyGems, Packagist and
  crates.io returned no first-party Lagou packages.
